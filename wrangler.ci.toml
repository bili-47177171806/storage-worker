# CI deploy template — rendered by .github/workflows/deploy.yml via envsubst.
# Contains NO real values (per SECURITY.md: bucket / endpoint / hosts stay out of git).
# All ${VARS} are injected from GitHub repo Secrets/Variables at deploy time.
# Real secrets (OSS_AKID, OSS_AKS) live on the Worker via `wrangler secret put`,
# NOT here — they persist across deploys and are never rendered into this file.

name = "storage"
main = "worker.js"
compatibility_date = "2026-07-06"

[vars]
OSS_BUCKET = "${OSS_BUCKET}"
OSS_ENDPOINT = "${OSS_ENDPOINT}"
OSS_PREFIX = "${OSS_PREFIX}"
OSS_UPLOAD_HOST = "${OSS_UPLOAD_HOST}"
OSS_PUT_MODE = "${OSS_PUT_MODE}"
PUBLIC_STORAGE_HOST = "${PUBLIC_STORAGE_HOST}"
PUBLIC_R2_HOST = "${PUBLIC_R2_HOST}"
ABUSE_REPORT_EMAIL = "${ABUSE_REPORT_EMAIL}"

# SEKAI Pass D1 — only touched by uploads > 512 MiB. Anonymous uploads never query it.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "sekai_pass_db"
database_id = "${AUTH_DB_ID}"

[cache]
enabled = true
