name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install
        run: npm ci || npm install
      - name: Render wrangler config
        env:
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
          OSS_UPLOAD_HOST: ${{ secrets.OSS_UPLOAD_HOST }}
          OSS_PUT_MODE: ${{ secrets.OSS_PUT_MODE }}
          PUBLIC_STORAGE_HOST: ${{ secrets.PUBLIC_STORAGE_HOST }}
          PUBLIC_R2_HOST: ${{ secrets.PUBLIC_R2_HOST }}
          ABUSE_REPORT_EMAIL: ${{ secrets.ABUSE_REPORT_EMAIL }}
          AUTH_DB_ID: ${{ secrets.AUTH_DB_ID }}
        run: |
          envsubst < wrangler.ci.toml > wrangler.toml
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
