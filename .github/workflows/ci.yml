name: CI

on:
  push:
    branches: [main, master]
  # 不限定 base 分支 —— 栈式 PR（base 指向另一个特性分支）也应该跑 CI
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # worker.js 现在 import @25-ji-code-de/sekai-worker-kit（> 512 MiB 上传鉴权），
      # 测试会加载 worker.js，必须先装依赖。lockfile 被 gitignore，故 ci 回退到 install。
      - name: Install
        run: npm ci || npm install
      - name: Syntax check worker.js
        run: node --check worker.js
      - name: Test
        run: npm test
