name: CI

on:
  push:
    branches: [main, master]
  # 不限定 base 分支 —— 栈式 PR（base 指向另一个特性分支）也应该跑 CI
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax check worker.js
        run: node --check worker.js
